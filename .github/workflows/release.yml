name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      CARGO_MANIFEST: poc/steam-server-query/Cargo.toml
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        # Upstream release checked 2026-11-07: https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-11-07
        with:
          persist-credentials: false

      - name: Verify release tag and toolchain
        run: |
          set -eu
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$CARGO_MANIFEST" | head -n 1)"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            printf 'Release tag %s does not match package version %s\n' "$RELEASE_TAG" "$package_version" >&2
            exit 1
          fi
          if [ "$RELEASE_ARCH" = amd64 ] && [ "$RUNNER_ARCH" = X64 ]; then
            :
          elif [ "$RELEASE_ARCH" = arm64 ] && [ "$RUNNER_ARCH" = ARM64 ]; then
            :
          else
            printf 'Runner architecture %s does not match release architecture %s\n' "$RUNNER_ARCH" "$RELEASE_ARCH" >&2
            exit 1
          fi
          rustc +1.99.1 --version
          cargo +1.99.1 --version

      - name: Run tests
        run: cargo +1.99.1 test --manifest-path "$CARGO_MANIFEST" --locked

      - name: Build release binary
        run: cargo +1.99.1 build --manifest-path "$CARGO_MANIFEST" --release --locked

      - name: Package binary
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          package_name="goldsrc-server-${version}-linux-${RELEASE_ARCH}"
          package_dir="$RUNNER_TEMP/package-${RELEASE_ARCH}"
          artifact_dir="$RUNNER_TEMP/release-artifact-${RELEASE_ARCH}"
          mkdir -p "$package_dir" "$artifact_dir"
          install -m 0755 poc/steam-server-query/target/release/steam-server-query-poc "$package_dir/goldsrc-server"
          tar -C "$package_dir" -czf "$artifact_dir/${package_name}.tar.gz" goldsrc-server

      - name: Upload binary package
        # Upstream release checked 2026-11-07: https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, verified 2026-11-07
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-artifact-${{ matrix.arch }}/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build and publish architecture image
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_VERSION#v}"
          context="$RUNNER_TEMP/docker-context-${RELEASE_ARCH}"
          mkdir -p "$context"
          cp poc/steam-server-query/docker/Dockerfile "$context/Dockerfile"
          install -m 0755 poc/steam-server-query/target/release/steam-server-query-poc "$context/goldsrc-server"
          docker build --tag "${image}:${version}-${RELEASE_ARCH}" "$context"
          docker push "${image}:${version}-${RELEASE_ARCH}"

  publish:
    name: Publish release and multi-architecture image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download binary packages
        # Upstream release checked 2026-11-07: https://github.com/actions/download-artifact/releases/tag/v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, verified 2026-11-07
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Publish multi-architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          notes="Docker image (linux/amd64 and linux/arm64): \`${image}:${version}\`"
          release_args=(--verify-tag --title "$RELEASE_TAG" --generate-notes --notes "$notes")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            "${release_args[@]}"
